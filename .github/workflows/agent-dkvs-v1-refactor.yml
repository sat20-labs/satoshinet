name: Agent DKVS v1 refactor

on:
  push:
    branches: [agent/rgb11-dkvs-transfer-a]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply single-version DKVS refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'indexer/indexer/dkvs/write_validation.go',
              '// Public address mappings are version-2 Schnorr records only.',
              '// Public address mappings are pubkey-free account records.',
          )
          replace(
              'indexer/indexer/dkvs/write_validation.go',
              'if record.Version == VersionV2 {\n\t\treturn false, ValidateRecordIdentity(record, parsed)\n\t}',
              'if len(record.PubKey) == 0 {\n\t\treturn false, ValidateRecordIdentity(record, parsed)\n\t}',
          )
          replace(
              'indexer/indexer/dkvs/write_validation.go',
              'if record == nil || !IsSupportedRecordVersion(record.Version) {',
              'if record == nil || record.Version != Version {',
          )

          sdk = Path('indexer/indexer/dkvs/sdk.go')
          text = sdk.read_text()
          old = '''\tif err := VerifySignature(record); err != nil {\n\t\treturn err\n\t}\n\tif IsTombstone(record.Flags) && len(record.Value) != 0 {'''
          new = '''\tif err := VerifySignature(record); err != nil {\n\t\treturn err\n\t}\n\tif err := ValidateRecordIdentity(record, parsed); err != nil {\n\t\treturn err\n\t}\n\tif IsTombstone(record.Flags) && len(record.Value) != 0 {'''
          if old not in text:
              raise SystemExit('missing VerifyRecordForClient insertion point')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''func AccountID(pubKey []byte) string {\n\treturn personalAccountID(pubKey)\n}\n\nfunc PersonalKey(pubKey []byte, path string) (string, error) {\n\tkey := "/personal/" + AccountID(pubKey) + "/" + normalizePath(path)\n\t_, err := ParseKey(key)\n\treturn key, err\n}''',
              '''func AccountID(pubKey []byte) string {\n\taccountID, err := CanonicalAccountID(pubKey)\n\tif err != nil {\n\t\treturn ""\n\t}\n\treturn accountID\n}\n\nfunc PersonalKey(pubKey []byte, path string) (string, error) {\n\taccountID, err := CanonicalAccountID(pubKey)\n\tif err != nil {\n\t\treturn "", err\n\t}\n\treturn AccountPersonalKey(accountID, path)\n}''',
          )
          sdk.write_text(text)

          fee = Path('indexer/indexer/dkvs/fee_autopay.go')
          text = fee.read_text()
          if 'func positiveRat(' not in text:
              text += '''\nfunc positiveRat(value string) (*big.Rat, error) {\n\trat, err := parseRat(value)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif rat.Sign() <= 0 {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\treturn rat, nil\n}\n\nfunc nonNegativeRat(value string) (*big.Rat, error) {\n\tif strings.TrimSpace(value) == "" {\n\t\treturn new(big.Rat), nil\n\t}\n\trat, err := parseRat(value)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif rat.Sign() < 0 {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\treturn rat, nil\n}\n\nfunc parseRat(value string) (*big.Rat, error) {\n\tvalue = strings.TrimSpace(value)\n\tif value == "" {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\trat := new(big.Rat)\n\tif _, ok := rat.SetString(value); !ok {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\treturn rat, nil\n}\n'''
              fee.write_text(text)

          old_test = Path('indexer/indexer/dkvs/account_v2_test.go')
          if old_test.exists():
              text = old_test.read_text()
              for old, new in [
                  ('signedAccountRecordV2', 'signedAccountRecord'),
                  ('NewRecordV2', 'NewAccountRecord'),
                  ('TestAccountIDV2AndAddressMapping', 'TestAccountIDAndAddressMapping'),
                  ('AccountIDV2', 'CanonicalAccountID'),
                  ('AccountPubKeyV2', 'AccountPubKey'),
                  ('TestAccountV2PersonalAndMailboxPermissions', 'TestAccountPersonalAndMailboxPermissions'),
                  ('PersonalKeyV2', 'AccountPersonalKey'),
                  ('TestAccountV2RejectsForgedAddressMapping', 'TestAccountRejectsForgedAddressMapping'),
              ]:
                  text = text.replace(old, new)
              text = re.sub(r'\nfunc TestAccountV2KeepsVersionOneCompatibility\(t \*testing\.T\) \{.*?\n\}\n?$', '\n', text, flags=re.S)
              Path('indexer/indexer/dkvs/account_test.go').write_text(text)
              old_test.unlink()

          workflow = Path('.github/workflows/dkvs-dev-bootstrap.yml')
          text = workflow.read_text().replace('rgb11-dkvs-v2', 'rgb11-dkvs-v1')
          text = text.replace('DKVS v2 checks passed', 'DKVS v1 checks passed')
          text = text.replace('DKVS v2 checks failed', 'DKVS v1 checks failed')
          workflow.write_text(text)

          leftovers = []
          for p in Path('indexer/indexer/dkvs').glob('*.go'):
              data = p.read_text()
              if 'VersionV2' in data or 'AccountIDV2' in data or 'NewRecordV2' in data or 'PersonalKeyV2' in data:
                  leftovers.append(str(p))
          if leftovers:
              raise SystemExit('v2 identifiers remain: ' + ', '.join(leftovers))
          PY
          gofmt -w indexer/indexer/dkvs/*.go
      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'make x-only account records the DKVS v1 format'
          git push origin HEAD:agent/rgb11-dkvs-transfer-a
