name: ChatGPT EVM funding-order fix
# Re-run the committed source state through the complete test suite.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-evm-funding-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout satoshinet fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: satoshinet
          fetch-depth: 0

      - name: Checkout indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: indexer
          fetch-depth: 1

      - name: Checkout sat20wallet SDK dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          path: sat20wallet
          fetch-depth: 1
          sparse-checkout: |
            sdk
          sparse-checkout-cone-mode: true

      - name: Set up Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false

      - name: Apply funding-order fix and tests
        working-directory: satoshinet
        run: |
          python3 .github/scripts/apply_evm_funding_order_fix.py
          gofmt -w \
            contract/evm/backend.go \
            contract/evm/runtime.go \
            contract/evm/funding_order_test.go \
            contract/node/services.go \
            contract/node/evm_validation.go
          python3 .github/scripts/adjust_evm_funding_order_fix.py
          python3 .github/scripts/finalize_evm_funding_order_fix.py
          gofmt -w \
            contract/evm/backend.go \
            contract/evm/runtime.go \
            contract/evm/funding_order_test.go \
            contract/node/services.go \
            contract/node/evm_validation.go
          git diff --check

      - name: Vendor dependencies
        working-directory: satoshinet
        run: go mod vendor

      - name: Run focused EVM and node tests
        working-directory: satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test -mod=vendor -count=1 ./contract/evm ./contract/node 2>&1 | tee focused-tests.log

      - name: Run all Go test cases
        working-directory: satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test -mod=vendor -count=1 ./... 2>&1 | tee all-tests.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evm-funding-order-test-logs-${{ github.run_number }}
          path: |
            satoshinet/focused-tests.log
            satoshinet/all-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit tested source changes
        working-directory: satoshinet
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            contract/evm/backend.go \
            contract/evm/runtime.go \
            contract/evm/funding_order_test.go \
            contract/node/services.go \
            contract/node/evm_validation.go
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(evm): isolate funding by transaction order"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
