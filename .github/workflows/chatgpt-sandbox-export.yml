name: Apply reviewed EVM funding-order fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chatgpt/sandbox-export-f106d36'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply sandbox-verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/chatgpt-patch/*.b64 | tr -d '\n' | base64 -d > /tmp/evm-funding-order.diff
          git apply --check /tmp/evm-funding-order.diff
          git apply /tmp/evm-funding-order.diff
          rm -rf .github/chatgpt-patch
          rm -f .github/workflows/chatgpt-sandbox-export.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "fix EVM funding visibility order"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
