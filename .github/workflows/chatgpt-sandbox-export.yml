name: ChatGPT sandbox source export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout satoshinet
        uses: actions/checkout@v4
        with:
          path: satoshinet
          fetch-depth: 1

      - name: Checkout indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: indexer
          fetch-depth: 1

      - name: Checkout sat20wallet SDK dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          path: sat20wallet
          fetch-depth: 1
          sparse-checkout: |
            sdk
          sparse-checkout-cone-mode: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false

      - name: Vendor all Go dependencies
        working-directory: satoshinet
        run: go mod vendor

      - name: Remove checkout metadata
        run: rm -rf satoshinet/.git

      - name: Upload sandbox workspace
        uses: actions/upload-artifact@v4
        with:
          name: satoshinet-sandbox-source
          path: satoshinet
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
