name: DKVS development checks

on:
  push:
    branches:
      - agent/dkvs-v2-implementation
      - agent/rgb11-dkvs-transfer-a
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  dkvs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out SatoshiNet
        uses: actions/checkout@v4
        with:
          path: workspace/satoshinet
          fetch-depth: 0

      - name: Check out indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: workspace/indexer

      - name: Check out wallet dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          path: workspace/sat20wallet

      - name: Set up Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: false

      - name: Format DKVS sources
        working-directory: workspace/satoshinet
        shell: bash
        run: find indexer/indexer/dkvs -maxdepth 1 -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Commit formatting
        if: github.event_name == 'push'
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          if git diff --quiet -- indexer/indexer/dkvs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indexer/indexer/dkvs/*.go
          git commit -m 'gofmt RGB11 DKVS implementation'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run DKVS package tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/indexer/dkvs -count=1

      - name: Run DKVS server tests
        working-directory: workspace/satoshinet
        run: go test . -run '^TestDKVS' -count=1

      - name: Run DKVS HTTP tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/rpcserver/indexer -run '^(TestDKVSLocalOnlyMiddleware|TestBindDKVSJSONBodyLimit)$' -count=1

      - name: Compile integration packages
        working-directory: workspace/satoshinet
        run: go test ./wire ./peer ./indexer/indexer ./indexer/share/indexer -run '^$'

      - name: Run focused race tests
        working-directory: workspace/satoshinet
        run: go test -race ./indexer/indexer/dkvs -run '^(TestResolverDoesNotHoldIndexerWriteLock|TestPhysicalDeleteFloorAndRecreate|TestPathMetaTracksPutUpdateDelete)$' -count=1

      - name: Run full repository regression
        working-directory: workspace/satoshinet
        run: go test ./... -count=1

      - name: Publish commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'rgb11-dkvs-v2',
              description: state === 'success' ? 'DKVS v2 checks passed' : 'DKVS v2 checks failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
