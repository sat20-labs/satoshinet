name: Temporary update AUTOPAY tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-autopay-tests:
    if: github.head_ref == 'feat/dkvs-paid-retention-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update legacy AUTOPAY fixtures
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'TestAutopayCapacityReleasesExpiredRecord' indexer/indexer/dkvs/indexer_test.go; then
            echo 'AUTOPAY fixtures already updated.'
            exit 0
          fi
          echo '' | base64 -d > /tmp/patch_autopay_tests.py
          python3 /tmp/patch_autopay_tests.py
          gofmt -w indexer/indexer/dkvs/indexer_test.go
          git config user.name github-actions[bot]
          git config user.email 418982201+github-actions[bot]@users.noreply.github.com
          git add indexer/indexer/dkvs/indexer_test.go
          git commit -m 'test: update AUTOPAY fixtures for current-block retention'
          git push origin HEAD:${{ github.head_ref }}
