name: DKVS development checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  patch-initial-paid-relay:
    if: github.head_ref == 'feat/dkvs-paid-retention-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Prime verified paid records before relay decision
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'primePaidRetentionAfterFeeVerification' indexer/indexer/dkvs/indexer.go; then
            echo 'Initial paid relay priming already applied.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          indexer = Path('indexer/indexer/dkvs/indexer.go')
          text = indexer.read_text()
          old = '''\t\tif !IsTombstone(record.Flags) {
\t\t\tif err := verifyFeeProofWith(validators.feeVerifier, record, parsed); err != nil {
\t\t\t\treturn false, 0, chainhash.Hash{}, false, err
\t\t\t}
\t\t}
\t\tif remote && i.isLocalOnlyRecord(record) {
'''
          new = '''\t\tif !IsTombstone(record.Flags) {
\t\t\tif err := verifyFeeProofWith(validators.feeVerifier, record, parsed); err != nil {
\t\t\t\treturn false, 0, chainhash.Hash{}, false, err
\t\t\t}
\t\t\tif err := i.primePaidRetentionAfterFeeVerification(record, parsed, validators.feeVerifier); err != nil {
\t\t\t\treturn false, 0, chainhash.Hash{}, false, err
\t\t\t}
\t\t}
\t\tif remote && i.isLocalOnlyRecord(record) {
'''
          if old not in text:
              raise SystemExit('indexer put fee-verification insertion point not found')
          indexer.write_text(text.replace(old, new, 1))

          paid = Path('indexer/indexer/dkvs/paid_retention.go')
          text = paid.read_text()
          old = '''func (c *paidRetentionCache) get(key string) (PaidRecordRetention, bool) {
\tif c == nil {
\t\treturn PaidRecordRetention{}, false
\t}
\tc.mutex.RLock()
\tentry, ok := c.entries[key]
\tc.mutex.RUnlock()
\treturn entry, ok
}

func (c *paidRetentionCache) remove(keys []string) {
'''
          new = '''func (c *paidRetentionCache) get(key string) (PaidRecordRetention, bool) {
\tif c == nil {
\t\treturn PaidRecordRetention{}, false
\t}
\tc.mutex.RLock()
\tentry, ok := c.entries[key]
\tc.mutex.RUnlock()
\treturn entry, ok
}

func (c *paidRetentionCache) set(key string, retention PaidRecordRetention) {
\tif c == nil || key == "" {
\t\treturn
\t}
\tc.mutex.Lock()
\tc.entries[key] = retention
\tc.mutex.Unlock()
}

func (c *paidRetentionCache) remove(keys []string) {
'''
          if old not in text:
              raise SystemExit('paid retention cache insertion point not found')
          text = text.replace(old, new, 1)
          marker = '''func isAutopayRecord(record *wire.DKVSRecord) bool {
'''
          helper = '''// primePaidRetentionAfterFeeVerification records the same current-block
// payment that was just accepted by the fee verifier. It runs before the relay
// decision, so a newly written or remotely received paid record can propagate
// immediately. Records loaded after restart still fail closed until refreshed.
func (i *Indexer) primePaidRetentionAfterFeeVerification(record *wire.DKVSRecord, parsed ParsedKey,
\tverifier FeeVerifier) error {
\tif !isAutopayRecord(record) {
\t\treturn nil
\t}
\tretentionVerifier, ok := verifier.(PaidRecordRetentionVerifier)
\tif !ok {
\t\treturn ErrInvalidFeeProof
\t}
\tretention, err := retentionVerifier.PaidRecordRetention(record, parsed)
\tif err != nil {
\t\treturn err
\t}
\tif !paidRetentionCurrent(retention, i.currentHeight()) {
\t\treturn ErrInvalidFeeProof
\t}
\tpaidRetentionCacheFor(i).set(record.Key, retention)
\treturn nil
}

'''
          if marker not in text:
              raise SystemExit('paid retention helper insertion point not found')
          paid.write_text(text.replace(marker, helper + marker, 1))

          test = Path('indexer/indexer/dkvs/paid_relay_refresh_test.go')
          text = test.read_text()
          old = '''\trecord := signedAutopayPersonalRecord(t, priv, "autopay", 1)
\tif _, err := idx.PutLocal(record); err != nil {
\t\tt.Fatalf("put paid record: %v", err)
\t}

\trecords, _, done, _, err := idx.Sync(nil, 100)
'''
          new = '''\trecord := signedAutopayPersonalRecord(t, priv, "autopay", 1)
\tif _, err := idx.PutLocal(record); err != nil {
\t\tt.Fatalf("put paid record: %v", err)
\t}
\t// Model a process restart: persisted records remain, but the derived
\t// retention cache is intentionally empty until contract state is refreshed.
\tpaidRetentionCacheFor(idx).replace(make(map[string]PaidRecordRetention))

\trecords, _, done, _, err := idx.Sync(nil, 100)
'''
          if old not in text:
              raise SystemExit('fail-closed test insertion point not found')
          test.write_text(text.replace(old, new, 1))

          Path('indexer/indexer/dkvs/paid_initial_relay_test.go').write_text(r'''package dkvs

import (
	"testing"

	dbpkg "github.com/sat20-labs/indexer/indexer/db"
	"github.com/sat20-labs/satoshinet/btcec"
	"github.com/sat20-labs/satoshinet/chaincfg"
)

func TestVerifiedAutopayRecordRelaysImmediately(t *testing.T) {
	database := dbpkg.NewKVDB(t.TempDir())
	if database == nil {
		t.Fatal("NewKVDB failed")
	}
	t.Cleanup(func() { _ = database.Close() })
	priv, err := btcec.NewPrivateKey()
	if err != nil {
		t.Fatal(err)
	}
	payer, err := P2TRAddressFromPubKeyBytes(priv.PubKey().SerializeCompressed(), &chaincfg.TestNetParams)
	if err != nil {
		t.Fatal(err)
	}
	height := uint64(10)
	provider := &mutableAutopayStateProvider{state: &AutopayContractState{
		TemplateName: autopayTemplateName,
		CurrentBlock: int64(height),
		ServiceName:  "dkvs",
		Recipient:    "recipient",
		FeeAssetName: "sgas",
		Status:       "active",
		Delegates: map[string]AutopayDelegateState{
			payer: {AmountPerBlock: "1", Balance: "100", LastPayHeight: int64(height), Status: "active"},
		},
	}}
	cached := &HeightCachedAutopayStateProvider{Provider: provider, CurrentHeight: func() uint64 { return height }}
	verifier := LocalCacheAutopayFeeVerifier{AutopayFeeVerifier: AutopayFeeVerifier{
		StateProvider: cached, Contract: "autopay", ServiceName: "dkvs", Recipient: "recipient",
		FeeAssetName: "sgas", FullRecordFeePerBlock: "1", AddressParams: &chaincfg.TestNetParams,
	}, AllowFreeLocal: true}
	idx := New(database, Config{
		AllowFreeLocal: true,
		FreeLocalCache: FreeLocalCachePolicy{Enabled: true, MaxTTL: 60_000, MaxRecordsPerSigner: 10,
			MaxBytesPerSigner: 1 << 20, MaxTotalRecords: 100, MaxTotalBytes: 1 << 20},
		FeeVerifier: verifier, CurrentHeight: func() uint64 { return height },
	})
	record := signedAutopayPersonalRecord(t, priv, "autopay", 1)
	if _, err := idx.PutLocal(record); err != nil {
		t.Fatalf("put paid record: %v", err)
	}
	records, _, done, _, err := idx.Sync(nil, 100)
	if err != nil || !done {
		t.Fatalf("sync paid record: done=%v err=%v", done, err)
	}
	if len(records) != 1 || records[0].Key != record.Key {
		t.Fatalf("newly verified paid record did not relay: %+v", records)
	}
}
''')
          PY
          gofmt -w indexer/indexer/dkvs/indexer.go indexer/indexer/dkvs/paid_retention.go \
            indexer/indexer/dkvs/paid_relay_refresh_test.go indexer/indexer/dkvs/paid_initial_relay_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indexer/indexer/dkvs/indexer.go indexer/indexer/dkvs/paid_retention.go \
            indexer/indexer/dkvs/paid_relay_refresh_test.go indexer/indexer/dkvs/paid_initial_relay_test.go
          git commit -m 'fix: relay newly verified AUTOPAY records'
          git push origin HEAD:${{ github.head_ref }}

  dkvs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out SatoshiNet
        uses: actions/checkout@v4
        with:
          path: workspace/satoshinet
          fetch-depth: 0
      - name: Check out indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: workspace/indexer
      - name: Check out wallet dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          ref: main
          path: workspace/sat20wallet
      - name: Set up Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: false
      - name: Check formatting
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          files=$(git diff --name-only origin/main...HEAD -- 'indexer/indexer/dkvs/*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted files:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Check single-version DKVS API
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          if grep -R -n -E 'VersionV2|AccountIDV2|AccountPubKeyV2|PersonalKeyV2|NewRecordV2|KeepsVersionOneCompatibility' indexer/indexer/dkvs; then
            echo 'DKVS must expose only the canonical version-1 account format.'
            exit 1
          fi
      - name: Vet DKVS package
        working-directory: workspace/satoshinet
        run: go vet ./indexer/indexer/dkvs
      - name: Run DKVS package tests
        id: dkvs-package-tests
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test ./indexer/indexer/dkvs -count=1 2>&1 | tee /tmp/dkvs-package-tests.log
      - name: Upload DKVS package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dkvs-package-tests-${{ github.run_id }}
          path: /tmp/dkvs-package-tests.log
          retention-days: 3
      - name: Run DKVS server tests
        working-directory: workspace/satoshinet
        run: go test . -run '^TestDKVS' -count=1
      - name: Run DKVS HTTP tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/rpcserver/indexer -run '^(TestDKVSLocalOnlyMiddleware|TestBindDKVSJSONBodyLimit)$' -count=1
      - name: Compile integration packages
        id: integration-compile
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test ./wire ./peer ./indexer/indexer ./indexer/share/indexer -run '^$' 2>&1 | tee /tmp/dkvs-integration-compile.log
      - name: Upload integration compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dkvs-integration-compile-${{ github.run_id }}
          path: /tmp/dkvs-integration-compile.log
          retention-days: 3
      - name: Run focused race tests
        working-directory: workspace/satoshinet
        run: go test -race ./indexer/indexer/dkvs -run '^(TestResolverDoesNotHoldIndexerWriteLock|TestPhysicalDeleteFloorAndRecreate|TestPathMetaTracksPutUpdateDelete)$' -count=1
      - name: Run full repository regression
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee /tmp/satoshinet-full-regression.log
      - name: Upload full repository diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: satoshinet-full-regression-${{ github.run_id }}
          path: /tmp/satoshinet-full-regression.log
          retention-days: 3
