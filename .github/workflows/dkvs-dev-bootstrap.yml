name: DKVS development checks

on:
  push:
    branches:
      - agent/rgb11-dkvs-transfer-a
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  patch-paid-lifetime:
    if: github.head_ref == 'feat/dkvs-paid-retention-p0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out SatoshiNet branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Enforce zero record lifetime for AUTOPAY
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f indexer/indexer/dkvs/paid_lifetime_test.go ]]; then
            echo 'AUTOPAY lifetime invariant already applied.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('indexer/indexer/dkvs/write_validation.go')
          text = path.read_text()
          old = '''\tif IsExpired(record, height, now) && !(allowExpiredTombstone && IsTombstone(record.Flags)) {
          \t\treturn parsed, ErrExpiredRecord
          \t}
          '''
          new = '''\tif verifyFee && !IsTombstone(record.Flags) && isAutopayRecord(record) &&
          \t\t(record.TTL != 0 || record.ExpiryHeight != 0) {
          \t\treturn parsed, ErrInvalidFeeProof
          \t}
          \tif IsExpired(record, height, now) && !(allowExpiredTombstone && IsTombstone(record.Flags)) {
          \t\treturn parsed, ErrExpiredRecord
          \t}
          '''
          if old not in text:
              raise SystemExit('write validation insertion point not found')
          path.write_text(text.replace(old, new, 1))

          Path('indexer/indexer/dkvs/paid_lifetime_test.go').write_text(r'''package dkvs

import (
	"errors"
	"testing"

	"github.com/sat20-labs/satoshinet/btcec"
	"github.com/sat20-labs/satoshinet/btcec/schnorr"
	"github.com/sat20-labs/satoshinet/chaincfg"
)

func resignPaidLifetimeRecord(t *testing.T, record *Record, priv *btcec.PrivateKey) {
	t.Helper()
	hash := SigningHash(record)
	sig, err := schnorr.Sign(priv, hash[:])
	if err != nil {
		t.Fatal(err)
	}
	record.Signature = sig.Serialize()
}

func TestAutopayRecordRejectsRecordLevelLifetime(t *testing.T) {
	priv, err := btcec.NewPrivateKey()
	if err != nil {
		t.Fatal(err)
	}
	payer, err := P2TRAddressFromPubKeyBytes(priv.PubKey().SerializeCompressed(), &chaincfg.TestNetParams)
	if err != nil {
		t.Fatal(err)
	}
	height := uint64(10)
	provider := &mutableAutopayStateProvider{state: &AutopayContractState{
		TemplateName: autopayTemplateName,
		CurrentBlock: int64(height),
		ServiceName:  "dkvs",
		Recipient:    "recipient",
		FeeAssetName: "sgas",
		Status:       "active",
		Delegates: map[string]AutopayDelegateState{
			payer: {AmountPerBlock: "1", Balance: "100", LastPayHeight: int64(height), Status: "active"},
		},
	}}
	verifier := LocalCacheAutopayFeeVerifier{AutopayFeeVerifier: AutopayFeeVerifier{
		StateProvider: provider, Contract: "autopay", ServiceName: "dkvs", Recipient: "recipient",
		FeeAssetName: "sgas", FullRecordFeePerBlock: "1", AddressParams: &chaincfg.TestNetParams,
	}, AllowFreeLocal: true}

	for name, mutate := range map[string]func(*Record){
		"ttl":           func(record *Record) { record.TTL = 60_000 },
		"expiry_height": func(record *Record) { record.ExpiryHeight = height + 100 },
	} {
		t.Run(name, func(t *testing.T) {
			record := signedAutopayPersonalRecord(t, priv, "autopay", 1)
			mutate(record)
			resignPaidLifetimeRecord(t, record, priv)
			_, err := validateParsedCoreWithVerifier(record, height, record.IssueTime, false, true, verifier)
			if !errors.Is(err, ErrInvalidFeeProof) {
				t.Fatalf("expected invalid fee proof, got %v", err)
			}
		})
	}
}
''')
          PY
          gofmt -w indexer/indexer/dkvs/write_validation.go indexer/indexer/dkvs/paid_lifetime_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indexer/indexer/dkvs/write_validation.go indexer/indexer/dkvs/paid_lifetime_test.go
          git commit -m 'fix: enforce AUTOPAY record lifetime invariant'
          git push origin HEAD:${{ github.head_ref }}

  dkvs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out SatoshiNet
        uses: actions/checkout@v4
        with:
          path: workspace/satoshinet
          fetch-depth: 0

      - name: Check out indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: workspace/indexer

      - name: Check out wallet dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          ref: main
          path: workspace/sat20wallet

      - name: Set up Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: false

      - name: Check formatting
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          files=$(git diff --name-only origin/main...HEAD -- 'indexer/indexer/dkvs/*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              printf 'Unformatted files:\n%s\n' "$unformatted"
              exit 1
            fi
          fi

      - name: Check single-version DKVS API
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          if grep -R -n -E 'VersionV2|AccountIDV2|AccountPubKeyV2|PersonalKeyV2|NewRecordV2|KeepsVersionOneCompatibility' indexer/indexer/dkvs; then
            echo 'DKVS must expose only the canonical version-1 account format.'
            exit 1
          fi

      - name: Vet DKVS package
        working-directory: workspace/satoshinet
        run: go vet ./indexer/indexer/dkvs

      - name: Run DKVS package tests
        id: dkvs-package-tests
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test ./indexer/indexer/dkvs -count=1 2>&1 | tee /tmp/dkvs-package-tests.log

      - name: Upload DKVS package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dkvs-package-tests-${{ github.run_id }}
          path: /tmp/dkvs-package-tests.log
          retention-days: 3

      - name: Run DKVS server tests
        working-directory: workspace/satoshinet
        run: go test . -run '^TestDKVS' -count=1

      - name: Run DKVS HTTP tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/rpcserver/indexer -run '^(TestDKVSLocalOnlyMiddleware|TestBindDKVSJSONBodyLimit)$' -count=1

      - name: Compile integration packages
        id: integration-compile
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test ./wire ./peer ./indexer/indexer ./indexer/share/indexer -run '^$' 2>&1 | tee /tmp/dkvs-integration-compile.log

      - name: Upload integration compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dkvs-integration-compile-${{ github.run_id }}
          path: /tmp/dkvs-integration-compile.log
          retention-days: 3

      - name: Run focused race tests
        working-directory: workspace/satoshinet
        run: go test -race ./indexer/indexer/dkvs -run '^(TestResolverDoesNotHoldIndexerWriteLock|TestPhysicalDeleteFloorAndRecreate|TestPathMetaTracksPutUpdateDelete)$' -count=1

      - name: Run full repository regression
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee /tmp/satoshinet-full-regression.log

      - name: Upload full regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: satoshinet-full-regression-${{ github.run_id }}
          path: /tmp/satoshinet-full-regression.log
          retention-days: 3

      - name: Publish commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'rgb11-dkvs-v1',
              description: state === 'success' ? 'DKVS v1 checks passed' : 'DKVS v1 checks failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
