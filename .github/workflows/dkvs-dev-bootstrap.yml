name: DKVS development checks

on:
  push:
    branches:
      - agent/rgb11-dkvs-transfer-a
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  dkvs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out SatoshiNet
        uses: actions/checkout@v4
        with:
          path: workspace/satoshinet
          fetch-depth: 0

      - name: Check out indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: workspace/indexer

      - name: Check out wallet dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          ref: agent/rgb11-dkvs-transfer-a
          path: workspace/sat20wallet

      - name: Set up Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: false

      - name: Apply DKVS v1 source fixups
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('indexer/indexer/dkvs/write_validation.go')
          text = p.read_text()
          text = text.replace('Public address mappings are version-2 Schnorr records only.', 'Public address mappings are pubkey-free account records.')
          text = text.replace('if record.Version == VersionV2 {\n\t\treturn false, ValidateRecordIdentity(record, parsed)\n\t}', 'if len(record.PubKey) == 0 {\n\t\treturn false, ValidateRecordIdentity(record, parsed)\n\t}')
          text = text.replace('if record == nil || !IsSupportedRecordVersion(record.Version) {', 'if record == nil || record.Version != Version {')
          p.write_text(text)

          p = Path('indexer/indexer/dkvs/sdk.go')
          text = p.read_text()
          needle = '\tif err := VerifySignature(record); err != nil {\n\t\treturn err\n\t}\n\tif IsTombstone(record.Flags) && len(record.Value) != 0 {'
          replacement = '\tif err := VerifySignature(record); err != nil {\n\t\treturn err\n\t}\n\tif err := ValidateRecordIdentity(record, parsed); err != nil {\n\t\treturn err\n\t}\n\tif IsTombstone(record.Flags) && len(record.Value) != 0 {'
          if needle in text:
              text = text.replace(needle, replacement, 1)
          old = 'func AccountID(pubKey []byte) string {\n\treturn personalAccountID(pubKey)\n}\n\nfunc PersonalKey(pubKey []byte, path string) (string, error) {\n\tkey := "/personal/" + AccountID(pubKey) + "/" + normalizePath(path)\n\t_, err := ParseKey(key)\n\treturn key, err\n}'
          new = 'func AccountID(pubKey []byte) string {\n\taccountID, err := CanonicalAccountID(pubKey)\n\tif err != nil {\n\t\treturn ""\n\t}\n\treturn accountID\n}\n\nfunc PersonalKey(pubKey []byte, path string) (string, error) {\n\taccountID, err := CanonicalAccountID(pubKey)\n\tif err != nil {\n\t\treturn "", err\n\t}\n\treturn AccountPersonalKey(accountID, path)\n}'
          text = text.replace(old, new)
          p.write_text(text)

          p = Path('indexer/indexer/dkvs/fee_autopay.go')
          text = p.read_text()
          if 'func positiveRat(' not in text:
              text += '''\nfunc positiveRat(value string) (*big.Rat, error) {\n\trat, err := parseRat(value)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif rat.Sign() <= 0 {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\treturn rat, nil\n}\n\nfunc nonNegativeRat(value string) (*big.Rat, error) {\n\tif strings.TrimSpace(value) == "" {\n\t\treturn new(big.Rat), nil\n\t}\n\trat, err := parseRat(value)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif rat.Sign() < 0 {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\treturn rat, nil\n}\n\nfunc parseRat(value string) (*big.Rat, error) {\n\tvalue = strings.TrimSpace(value)\n\tif value == "" {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\trat := new(big.Rat)\n\tif _, ok := rat.SetString(value); !ok {\n\t\treturn nil, ErrInvalidFeeProof\n\t}\n\treturn rat, nil\n}\n'''
          p.write_text(text)

          old_test = Path('indexer/indexer/dkvs/account_v2_test.go')
          if old_test.exists():
              text = old_test.read_text()
              for old, new in {
                  'signedAccountRecordV2': 'signedAccountRecord',
                  'NewRecordV2': 'NewAccountRecord',
                  'TestAccountIDV2AndAddressMapping': 'TestAccountIDAndAddressMapping',
                  'AccountIDV2': 'CanonicalAccountID',
                  'AccountPubKeyV2': 'AccountPubKey',
                  'TestAccountV2PersonalAndMailboxPermissions': 'TestAccountPersonalAndMailboxPermissions',
                  'PersonalKeyV2': 'AccountPersonalKey',
                  'TestAccountV2RejectsForgedAddressMapping': 'TestAccountRejectsForgedAddressMapping',
              }.items():
                  text = text.replace(old, new)
              marker = '\nfunc TestAccountV2KeepsVersionOneCompatibility'
              if marker in text:
                  text = text[:text.index(marker)] + '\n'
              Path('indexer/indexer/dkvs/account_test.go').write_text(text)
              old_test.unlink()

          # DKVS account IDs are now x-only public keys. All account-scoped
          # permission and test helpers must use AccountID rather than the
          # previous sha256(pubkey) helper.
          for path in Path('indexer/indexer/dkvs').glob('*.go'):
              if path.name == 'key.go':
                  continue
              text = path.read_text().replace('personalAccountID(', 'AccountID(')
              path.write_text(text)
          PY
          gofmt -w indexer/indexer/dkvs/*.go
          if grep -R -n -E 'VersionV2|AccountIDV2|AccountPubKeyV2|PersonalKeyV2|NewRecordV2' indexer/indexer/dkvs; then
            exit 1
          fi

      - name: Commit deterministic fixups
        if: github.event_name == 'push'
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'use x-only account IDs throughout DKVS'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run DKVS package tests
        id: dkvs-package-tests
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set +e
          go test ./indexer/indexer/dkvs -count=1 2>&1 | tee /tmp/dkvs-package-tests.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload DKVS package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dkvs-package-tests-${{ github.run_id }}
          path: /tmp/dkvs-package-tests.log
          retention-days: 3

      - name: Run DKVS server tests
        working-directory: workspace/satoshinet
        run: go test . -run '^TestDKVS' -count=1

      - name: Run DKVS HTTP tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/rpcserver/indexer -run '^(TestDKVSLocalOnlyMiddleware|TestBindDKVSJSONBodyLimit)$' -count=1

      - name: Compile integration packages
        working-directory: workspace/satoshinet
        run: go test ./wire ./peer ./indexer/indexer ./indexer/share/indexer -run '^$'

      - name: Run focused race tests
        working-directory: workspace/satoshinet
        run: go test -race ./indexer/indexer/dkvs -run '^(TestResolverDoesNotHoldIndexerWriteLock|TestPhysicalDeleteFloorAndRecreate|TestPathMetaTracksPutUpdateDelete)$' -count=1

      - name: Run full repository regression
        working-directory: workspace/satoshinet
        run: go test ./... -count=1

      - name: Publish commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'rgb11-dkvs-v1',
              description: state === 'success' ? 'DKVS v1 checks passed' : 'DKVS v1 checks failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
