name: Temporary paid relay fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-initial-paid-relay:
    if: github.head_ref == 'feat/dkvs-paid-retention-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Prime verified paid records before relay decision
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'primePaidRetentionAfterFeeVerification' indexer/indexer/dkvs/indexer.go; then
            echo 'Initial paid relay priming already applied.'
            exit 0
          fi
          echo '' | base64 -d > /tmp/patch_paid_relay.py
          python3 /tmp/patch_paid_relay.py
          gofmt -w indexer/indexer/dkvs/indexer.go indexer/indexer/dkvs/paid_retention.go indexer/indexer/dkvs/paid_relay_refresh_test.go indexer/indexer/dkvs/paid_initial_relay_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indexer/indexer/dkvs/indexer.go indexer/indexer/dkvs/paid_retention.go indexer/indexer/dkvs/paid_relay_refresh_test.go indexer/indexer/dkvs/paid_initial_relay_test.go
          git commit -m 'fix: relay newly verified AUTOPAY records'
          git push origin HEAD:${{ github.head_ref }}
