name: DKVS implementation validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/dkvs-v2-implementation
          path: workspace/satoshinet
          fetch-depth: 0
          persist-credentials: true

      - name: Check out indexer dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/indexer
          path: workspace/indexer

      - name: Check out wallet dependency
        uses: actions/checkout@v4
        with:
          repository: sat20-labs/sat20wallet
          path: workspace/sat20wallet

      - name: Set up Go 1.24.13
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.13
          cache: false

      - name: Apply implementation patch
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          cat .github/dkvs-v2.patch.xz.b64.part* | base64 -d | xz -d > /tmp/dkvs-v2.patch
          git apply --index --whitespace=error-all /tmp/dkvs-v2.patch
          git diff --cached --check

      - name: Check formatting
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          unformatted=$(git diff --cached --name-only -- '*.go' | xargs -r gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run DKVS package tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/indexer/dkvs -count=1

      - name: Run DKVS server tests
        working-directory: workspace/satoshinet
        run: go test . -run '^TestDKVS' -count=1

      - name: Run DKVS HTTP tests
        working-directory: workspace/satoshinet
        run: go test ./indexer/rpcserver/indexer -run '^(TestDKVSLocalOnlyMiddleware|TestBindDKVSJSONBodyLimit)$' -count=1

      - name: Compile integration packages
        working-directory: workspace/satoshinet
        run: go test ./wire ./peer ./indexer/indexer ./indexer/share/indexer -run '^$'

      - name: Run focused race tests
        working-directory: workspace/satoshinet
        run: go test -race ./indexer/indexer/dkvs -run '^(TestResolverDoesNotHoldIndexerWriteLock|TestPhysicalDeleteFloorAndRecreate|TestPathMetaTracksPutUpdateDelete)$' -count=1

      - name: Stage bootstrap cleanup
        working-directory: workspace/satoshinet
        run: |
          git rm .github/dkvs-v2.patch.xz.b64.part*
          git diff --cached --check

      - name: Commit validated implementation
        working-directory: workspace/satoshinet
        shell: bash
        run: |
          set -x
          git config user.name "ChatGPT DKVS implementation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "implement DKVS delete state and path sync"
          git push origin HEAD:agent/dkvs-v2-implementation
