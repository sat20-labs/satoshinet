name: DKVS development bootstrap

on:
  push:
    branches:
      - agent/dkvs-v2-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/satoshinet-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: satoshinet-source
          path: /tmp/satoshinet-source.tar.gz
          if-no-files-found: error
          retention-days: 1
