name: OpenAI sandbox source export

on:
  push:
    branches:
      - openai/evm-funding-order-fix-20260710
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Archive source and Go toolchain
        run: |
          git archive --format=zip --output=satoshinet-source.zip HEAD
          goroot="$(go env GOROOT)"
          tar -czf go1.24.13-linux-amd64.tar.gz -C "$(dirname "$goroot")" "$(basename "$goroot")"
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: satoshinet-source
          path: satoshinet-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload Go toolchain
        uses: actions/upload-artifact@v4
        with:
          name: go1.24.13-linux-amd64
          path: go1.24.13-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
