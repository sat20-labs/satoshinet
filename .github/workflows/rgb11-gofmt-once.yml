name: RGB11 one-shot gofmt

on:
  push:
    branches:
      - feat/rgb11-naming-indexer

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format changed Go files and remove helper
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w             indexer/indexer/base/rgb11_naming_test.go             indexer/indexer/dkvs/types.go             indexer/indexer/rgb11names/transcend.go             indexer/indexer/rgb11names/transcend_test.go             indexer/indexer/rgb11names/types.go
          rm .github/workflows/rgb11-gofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(indexer): gofmt RGB11 naming changes"
            git push origin HEAD:feat/rgb11-naming-indexer
          fi
