name: RGB11 naming checked integration

on:
  push:
    branches: [feat/rgb11-naming-indexer]
    paths:
      - '.github/rgb11-naming-index-apply.py'
      - '.github/workflows/rgb11-naming-index-apply.yml'

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'sat20-labs/satoshinet' && github.ref == 'refs/heads/feat/rgb11-naming-indexer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.13'
          cache: false
      - name: Apply reviewed exact replacements and format touched Go sources
        run: python3 .github/rgb11-naming-index-apply.py
      - name: Commit only reviewed indexer paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < .github/rgb11-naming-index-paths.txt
          for path in "${paths[@]}"; do
            [[ "$path" == indexer/*.go ]] || { echo "Unexpected path: $path"; exit 1; }
          done
          git diff --check
          git add -- "${paths[@]}"
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(indexer): integrate naming with block snapshots and atomic base flush'
          git push origin HEAD:refs/heads/feat/rgb11-naming-indexer
