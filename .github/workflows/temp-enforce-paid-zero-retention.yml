name: Temporary enforce AUTOPAY lifetime invariant

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/dkvs-paid-retention-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Enforce zero record lifetime for AUTOPAY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('indexer/indexer/dkvs/write_validation.go')
          text = path.read_text()
          old = '''\tif IsExpired(record, height, now) && !(allowExpiredTombstone && IsTombstone(record.Flags)) {
          \t\treturn parsed, ErrExpiredRecord
          \t}
          '''
          new = '''\tif verifyFee && !IsTombstone(record.Flags) && isAutopayRecord(record) &&
          \t\t(record.TTL != 0 || record.ExpiryHeight != 0) {
          \t\treturn parsed, ErrInvalidFeeProof
          \t}
          \tif IsExpired(record, height, now) && !(allowExpiredTombstone && IsTombstone(record.Flags)) {
          \t\treturn parsed, ErrExpiredRecord
          \t}
          '''
          if old not in text:
              raise SystemExit('write validation insertion point not found')
          path.write_text(text.replace(old, new, 1))

          Path('indexer/indexer/dkvs/paid_lifetime_test.go').write_text(r'''package dkvs

import (
	"errors"
	"testing"

	"github.com/sat20-labs/satoshinet/btcec"
	"github.com/sat20-labs/satoshinet/btcec/schnorr"
	"github.com/sat20-labs/satoshinet/chaincfg"
)

func resignPaidLifetimeRecord(t *testing.T, record *Record, priv *btcec.PrivateKey) {
	t.Helper()
	hash := SigningHash(record)
	sig, err := schnorr.Sign(priv, hash[:])
	if err != nil {
		t.Fatal(err)
	}
	record.Signature = sig.Serialize()
}

func TestAutopayRecordRejectsRecordLevelLifetime(t *testing.T) {
	priv, err := btcec.NewPrivateKey()
	if err != nil {
		t.Fatal(err)
	}
	payer, err := P2TRAddressFromPubKeyBytes(priv.PubKey().SerializeCompressed(), &chaincfg.TestNetParams)
	if err != nil {
		t.Fatal(err)
	}
	height := uint64(10)
	provider := &mutableAutopayStateProvider{state: &AutopayContractState{
		TemplateName: autopayTemplateName,
		CurrentBlock: int64(height),
		ServiceName:  "dkvs",
		Recipient:    "recipient",
		FeeAssetName: "sgas",
		Status:       "active",
		Delegates: map[string]AutopayDelegateState{
			payer: {AmountPerBlock: "1", Balance: "100", LastPayHeight: int64(height), Status: "active"},
		},
	}}
	verifier := LocalCacheAutopayFeeVerifier{AutopayFeeVerifier: AutopayFeeVerifier{
		StateProvider: provider, Contract: "autopay", ServiceName: "dkvs", Recipient: "recipient",
		FeeAssetName: "sgas", FullRecordFeePerBlock: "1", AddressParams: &chaincfg.TestNetParams,
	}, AllowFreeLocal: true}

	for name, mutate := range map[string]func(*Record){
		"ttl":           func(record *Record) { record.TTL = 60_000 },
		"expiry_height": func(record *Record) { record.ExpiryHeight = height + 100 },
	} {
		t.Run(name, func(t *testing.T) {
			record := signedAutopayPersonalRecord(t, priv, "autopay", 1)
			mutate(record)
			resignPaidLifetimeRecord(t, record, priv)
			_, err := validateParsedCoreWithVerifier(record, height, record.IssueTime, false, true, verifier)
			if !errors.Is(err, ErrInvalidFeeProof) {
				t.Fatalf("expected invalid fee proof, got %v", err)
			}
		})
	}
}
''')
          PY
          gofmt -w indexer/indexer/dkvs/write_validation.go indexer/indexer/dkvs/paid_lifetime_test.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add indexer/indexer/dkvs/write_validation.go indexer/indexer/dkvs/paid_lifetime_test.go
          git commit -m 'fix: enforce AUTOPAY record lifetime invariant'
          git push origin HEAD:${{ github.head_ref }}
